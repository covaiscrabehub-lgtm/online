<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My Requests - COVAI SCRAP HUB</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
background:#f8faf9;
color:#1a1a1a;
}

header{
background:linear-gradient(135deg,#10b981,#059669);
padding:20px;
box-shadow:0 2px 12px rgba(16,185,129,0.2);
}

h1{
font-size:24px;
color:#fff;
text-align:center;
font-weight:700;
}

main{
max-width:900px;
margin:20px auto;
padding:0 20px;
}

.search-card{
background:#fff;
border-radius:16px;
padding:24px;
margin-bottom:24px;
box-shadow:0 2px 12px rgba(0,0,0,0.06);
}

.search-card h2{
font-size:20px;
margin-bottom:8px;
}

.search-card p{
font-size:14px;
color:#6b7280;
margin-bottom:16px;
}

.search-group{
display:flex;
gap:12px;
}

.search-group input{
flex:1;
padding:14px;
border:2px solid #e5e7eb;
border-radius:10px;
font-size:14px;
outline:none;
}

.search-group input:focus{
border-color:#10b981;
}

.search-group button{
padding:14px 24px;
background:#10b981;
color:#fff;
border:0;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

.search-group button:hover{
background:#059669;
}

.requests-list{
display:grid;
gap:16px;
}

.request-card{
background:#fff;
border-radius:16px;
padding:20px;
box-shadow:0 2px 12px rgba(0,0,0,0.06);
position:relative;
}

.corner-badge{
position:absolute;
top:12px;
right:12px;
padding:6px 12px;
border-radius:20px;
font-size:11px;
font-weight:700;
}

.badge-new{background:#fef3c7;color:#92400e}
.badge-confirmed{background:#dbeafe;color:#1e40af}
.badge-processing{background:#e0e7ff;color:#4338ca}
.badge-assigned{background:#d1fae5;color:#065f46}
.badge-completed{background:#dcfce7;color:#166534}

.request-header{
margin-bottom:16px;
}

.pickup-id-big{
font-size:16px;
font-weight:700;
color:#10b981;
margin-bottom:4px;
}

.request-date{
font-size:12px;
color:#9ca3af;
}

.request-details{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:16px;
}

.detail-item{
background:#f9fafb;
padding:10px;
border-radius:8px;
}

.detail-label{
font-size:11px;
color:#6b7280;
margin-bottom:4px;
}

.detail-value{
font-size:13px;
font-weight:600;
}

.address-box{
background:#f9fafb;
padding:12px;
border-radius:8px;
margin-bottom:16px;
}

.track-btn{
width:100%;
padding:14px;
background:#10b981;
color:#fff;
border:0;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

.track-btn:hover{
background:#059669;
}

.empty-state{
text-align:center;
padding:60px 20px;
color:#9ca3af;
background:#fff;
border-radius:16px;
}

.loading{
text-align:center;
padding:60px;
}

.spinner{
width:40px;
height:40px;
border:3px solid #e5e7eb;
border-top-color:#10b981;
border-radius:50%;
animation:spin 0.8s linear infinite;
margin:0 auto 16px;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

@media(max-width:600px){
.search-group{flex-direction:column}
.request-details{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>📦 My Pickup Requests</h1>
</header>

<main>

<div class="search-card">
<h2>Track Your Pickups</h2>
<p>Enter your phone number to view all pickup requests</p>
<div class="search-group">
<input
id="phoneInput"
type="tel"
placeholder="Enter your phone number"
maxlength="10">
<button onclick="searchRequests()">Search</button>
</div>
</div>

<div id="requestsList" class="requests-list">
<div class="empty-state">
<h3>👋 Welcome!</h3>
<p>Enter your phone number above to view your pickup requests</p>
</div>
</div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
query,
orderByChild,
equalTo,
get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyApJhYmo0pHNqVD0XIyOlQDqDzACztHA",
authDomain:"covai-scrap-hub.firebaseapp.com",
databaseURL:"https://covai-scrap-hub-default-rtdb.firebaseio.com",
projectId:"covai-scrap-hub",
storageBucket:"covai-scrap-hub.firebasestorage.app",
messagingSenderId:"979133721874",
appId:"1:979133721874:web:c5829bb8dbf5270c0917cb",
measurementId:"G-P3PTSBHWMF"
};

const db=getDatabase(initializeApp(firebaseConfig));

window.searchRequests=async function(){

const phone=document.getElementById("phoneInput").value.trim();

if(!phone){
alert("Please enter phone number");
return;
}

if(phone.length<10){
alert("Please enter valid 10-digit phone number");
return;
}

document.getElementById("requestsList").innerHTML=`
<div class="loading">
<div class="spinner"></div>
<div>Searching pickups...</div>
</div>
`;

try{

// Get all pickups
const snap=await get(ref(db,"pickupRequests"));

if(!snap.exists()){
showEmpty("No pickups found");
return;
}

const data=snap.val();

// Filter by phone (check multiple phone fields)
const requests=Object.entries(data)
.map(([id,p])=>({...p,id}))
.filter(p=>{
const pPhone=String(p.phone||p.mobile||"").replace(/\D/g,"");
const searchPhone=phone.replace(/\D/g,"");
return pPhone===searchPhone||pPhone.endsWith(searchPhone);
})
.sort((a,b)=>{
const aTime=new Date(a.createdAt||a.submittedAt||0).getTime();
const bTime=new Date(b.createdAt||b.submittedAt||0).getTime();
return bTime-aTime; // Latest first
});

if(!requests.length){
showEmpty("No pickups found for this phone number");
return;
}

render(requests);

}catch(error){

console.error(error);

document.getElementById("requestsList").innerHTML=`
<div class="empty-state" style="color:#ef4444">
<h3>⚠️ Error</h3>
<p>${error.message}</p>
</div>
`;

}

};

function showEmpty(msg){

document.getElementById("requestsList").innerHTML=`
<div class="empty-state">
<h3>📭 ${msg}</h3>
<p>Try a different phone number</p>
</div>
`;

}

function render(requests){

document.getElementById("requestsList").innerHTML=
requests.map(renderCard).join("");

}

function renderCard(r){

const status=r.status||"New";
const badgeClass=getBadgeClass(status);

return`
<div class="request-card">

<span class="corner-badge ${badgeClass}">
${status.toUpperCase()}
</span>

<div class="request-header">
<div class="pickup-id-big">
Pickup ID: ${esc(r.id)}
</div>
<div class="request-date">
${formatDate(r.createdAt||r.submittedAt)}
</div>
</div>

<div class="request-details">

<div class="detail-item">
<div class="detail-label">CUSTOMER</div>
<div class="detail-value">
${esc(r.customerName||r.customer||r.name||"N/A")}
</div>
</div>

<div class="detail-item">
<div class="detail-label">PHONE</div>
<div class="detail-value">
${esc(r.phone||r.mobile||"N/A")}
</div>
</div>

<div class="detail-item">
<div class="detail-label">WEIGHT</div>
<div class="detail-value">
${(r.totalWeightKg||0).toFixed(2)} kg
</div>
</div>

<div class="detail-item">
<div class="detail-label">VALUE</div>
<div class="detail-value">
₹${(r.totalAmount||0).toFixed(2)}
</div>
</div>

</div>

<div class="address-box">
<div class="detail-label">PICKUP ADDRESS</div>
<div style="font-size:13px;color:#374151;line-height:1.6">
${esc(r.address||r.pickupAddress||"Not provided")}
</div>
</div>

${r.partnerName?`
<div style="
background:#d1fae5;
padding:10px;
border-radius:8px;
margin-bottom:12px;
font-size:13px;
color:#065f46">
<strong>Partner Assigned:</strong> ${esc(r.partnerName)}
</div>
`:""}

<button class="track-btn" onclick="trackPickup('${esc(r.id)}')">
📍 Track Live Location
</button>

</div>
`;

}

function getBadgeClass(status){
switch(status){
case"Confirmed":return"badge-confirmed";
case"Processing":return"badge-processing";
case"Partner Assigned":return"badge-assigned";
case"Completed":return"badge-completed";
default:return"badge-new";
}
}

function esc(v){
return String(v||"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));
}

function formatDate(value){
if(!value)return"Date unknown";
const d=new Date(value);
if(isNaN(d.getTime()))return"Date unknown";
return d.toLocaleString("en-IN",{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit",
hour12:true
});
}

window.trackPickup=function(id){
window.location.href="track.html?id="+encodeURIComponent(id);
};

</script>

</body>
</html>
