
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#087c4d"
>

<title>
    Manage Rates | COVAI SCRAP HUB
</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


:root{

    --green:#10b981;
    --dark:#047857;
    --blue:#2563eb;
    --red:#dc2626;

    --bg:#f5faf7;
    --text:#10231b;
    --muted:#6b7c74;
    --border:#e1ece6;

}


body{

    font-family:
        Inter,
        system-ui,
        sans-serif;

    background:
        radial-gradient(
            circle at 20% 0%,
            #dcfce7 0,
            transparent 30%
        ),
        var(--bg);

    color:var(--text);

    min-height:100vh;

}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{

    position:sticky;

    top:0;

    z-index:30;

    background:
        rgba(255,255,255,.9);

    backdrop-filter:
        blur(16px);

    border-bottom:
        1px solid var(--border);

    padding:
        9px 12px;

}


.topbar-inner{

    max-width:760px;

    margin:auto;

    display:flex;

    align-items:center;

    gap:9px;

}


.back-btn{

    width:34px;

    height:34px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:#fff;

    font-size:18px;

    cursor:pointer;

    color:var(--dark);

}


.topbar-title{

    font-size:15px;

    font-weight:900;

    flex:1;

}


/* =====================================================
   CONTAINER
===================================================== */

.container{

    width:
        min(
            100% - 20px,
            760px
        );

    margin:auto;

    padding:
        11px 0 30px;

}


/* =====================================================
   BANNER
===================================================== */

.banner{

    display:flex;

    align-items:center;

    gap:10px;

    padding:13px;

    border-radius:16px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #047857
        );

    box-shadow:
        0 10px 25px
        rgba(5,150,105,.18);

    margin-bottom:10px;

}


.banner-info{

    flex:1;

}


.label{

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:.12em;

    opacity:.8;

    font-weight:800;

}


.date{

    font-size:12px;

    font-weight:900;

    margin-top:3px;

}


/* =====================================================
   BUTTONS
===================================================== */

.btn{

    border:0;

    border-radius:10px;

    padding:
        9px 12px;

    font:
        800 10px Inter;

    cursor:pointer;

    white-space:nowrap;

}


.btn:active{

    transform:scale(.96);

}


.btn-light{

    background:
        rgba(255,255,255,.18);

    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.3);

}


.btn-blue{

    background:
        var(--blue);

    color:#fff;

}


.btn-red{

    background:#fff0f0;

    color:var(--red);

    border:
        1px solid #ffd5d5;

}


/* =====================================================
   PANEL
===================================================== */

.panel{

    background:#fff;

    border:
        1px solid var(--border);

    border-radius:15px;

    padding:11px;

    margin-bottom:10px;

    box-shadow:
        0 4px 15px
        rgba(15,80,50,.04);

}


.panel-title{

    font-size:11px;

    font-weight:900;

    margin-bottom:8px;

}


/* =====================================================
   ADD MATERIAL
===================================================== */

.add-grid{

    display:grid;

    grid-template-columns:
        1.5fr
        .8fr
        .7fr
        auto;

    gap:7px;

}


input{

    width:100%;

    height:36px;

    border:
        1px solid var(--border);

    border-radius:9px;

    padding:
        0 10px;

    font:
        700 11px Inter;

    color:var(--text);

    background:#fbfdfc;

}


input:focus{

    outline:none;

    border-color:
        var(--green);

    box-shadow:
        0 0 0 3px
        rgba(16,185,129,.1);

}


/* =====================================================
   RATE ITEM
===================================================== */

.rate-item{

    display:grid;

    grid-template-columns:
        38px
        minmax(0,1fr)
        105px
        72px
        70px;

    align-items:center;

    gap:8px;

    padding:8px;

    border:
        1px solid var(--border);

    border-radius:12px;

    background:#fff;

    margin-bottom:7px;

}


.icon{

    width:38px;

    height:38px;

    border-radius:10px;

    display:grid;

    place-items:center;

    background:#edfcf3;

    font-size:19px;

}


.name{

    font-size:11px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.unit{

    font-size:8px;

    color:var(--muted);

    margin-top:2px;

}


.price-input{

    text-align:right;

    height:34px;

}


.small-btn{

    height:34px;

    padding:
        0 8px;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    text-align:center;

    padding:35px;

    color:var(--muted);

    font-size:11px;

}


.spinner{

    width:24px;

    height:24px;

    border:
        3px solid #d7eee2;

    border-top-color:
        var(--green);

    border-radius:50%;

    animation:
        spin .8s linear infinite;

    margin:
        0 auto 8px;

}


@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;

    bottom:18px;

    transform:
        translate(-50%,20px);

    opacity:0;

    pointer-events:none;

    background:#10231b;

    color:#fff;

    padding:
        10px 14px;

    border-radius:10px;

    font-size:10px;

    font-weight:800;

    z-index:100;

    transition:.25s;

    box-shadow:
        0 10px 25px
        rgba(0,0,0,.18);

}


.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:620px){

    .container{

        width:
            min(
                100% - 14px,
                760px
            );

        padding-top:8px;

    }


    .banner{

        padding:11px;

        border-radius:13px;

    }


    .btn{

        padding:
            8px 9px;

    }


    .add-grid{

        grid-template-columns:
            1fr 1fr;

    }


    .add-grid input:first-child{

        grid-column:
            1 / -1;

    }


    .add-grid .btn{

        grid-column:
            1 / -1;

    }


    .rate-item{

        grid-template-columns:
            34px
            minmax(0,1fr)
            76px;

        gap:7px;

        padding:7px;

    }


    .icon{

        width:34px;

        height:34px;

        font-size:17px;

    }


    .rate-item .update-rate{

        grid-column:
            2 / 3;

    }


    .rate-item .delete-rate{

        grid-column:
            3 / 4;

    }


    .price-input{

        grid-column:
            3 / 4;

        grid-row:1;

        height:32px;

    }


    .rate-item .update-rate{

        height:31px;

    }


    .rate-item .delete-rate{

        height:31px;

    }

}


@media(max-width:390px){

    .rate-item{

        grid-template-columns:
            32px
            minmax(0,1fr)
            70px;

    }


    .name{

        font-size:10px;

    }


    .unit{

        font-size:7px;

    }


    .price-input{

        font-size:10px;

    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="topbar-inner">

        <button
            class="back-btn"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>


        <h1 class="topbar-title">
            Manage Scrap Rates
        </h1>

    </div>

</header>


<main class="container">


<section class="banner">

    <div class="banner-info">

        <div class="label">
            Rates dashboard
        </div>

        <div
            class="date"
            id="updateDate"
        >
            Loading...
        </div>

    </div>


    <button
        class="btn btn-light"
        id="updateAllBtn"
    >
        Update All
    </button>

</section>



<section class="panel">

    <div class="panel-title">
        Add New Material
    </div>


    <div class="add-grid">

        <input
            id="materialName"
            placeholder="Material name"
        >


        <input
            id="materialPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="Price"
        >


        <input
            id="materialUnit"
            value="kg"
            placeholder="Unit"
        >


        <button
            class="btn btn-blue"
            id="addBtn"
        >
            + Add Rate
        </button>

    </div>

</section>



<div
    id="loading"
    class="loading"
>

    <div class="spinner"></div>

    Loading rates...

</div>


<section
    id="ratesContainer"
></section>


</main>


<div
    id="toast"
    class="toast"
></div>



<script type="module">


/* =====================================================
   FIREBASE IMPORTS
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue,
    set,
    update,
    remove
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =====================================================
   COVAI SCRAP HUB - NEW FIREBASE PROJECT
   REALTIME DATABASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCAVdbE2YfcRUEizM9qhp3HMAdY2fEDUsc",

    authDomain:
        "covaiscrap.firebaseapp.com",

    databaseURL:
        "https://covaiscrap-default-rtdb.firebaseio.com",

    projectId:
        "covaiscrap",

    storageBucket:
        "covaiscrap.firebasestorage.app",

    messagingSenderId:
        "1093933670685",

    appId:
        "1:1093933670685:web:e305d3ed1e4f62e269c1f4",

    measurementId:
        "G-MCXYBSB57M"

};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(
        app
    );


/* =====================================================
   REALTIME DATABASE RATE PATH
===================================================== */

const ratesRef =
    ref(
        db,
        "scrapRates"
    );



/* =====================================================
   DEFAULT PRODUCTS
===================================================== */

const defaults = [

    {
        id:"steel",
        name:"Steel Scrap",
        price:45,
        unit:"kg",
        emoji:"🔩"
    },

    {
        id:"paper",
        name:"Paper Scrap",
        price:12,
        unit:"kg",
        emoji:"📰"
    },

    {
        id:"aluminium",
        name:"Aluminium Scrap",
        price:85,
        unit:"kg",
        emoji:"🥫"
    },

    {
        id:"copper",
        name:"Copper Scrap",
        price:420,
        unit:"kg",
        emoji:"🔶"
    },

    {
        id:"plastic",
        name:"Plastic Scrap",
        price:8,
        unit:"kg",
        emoji:"📦"
    },

    {
        id:"brass",
        name:"Brass Scrap",
        price:320,
        unit:"kg",
        emoji:"🔔"
    },

    {
        id:"iron",
        name:"Iron Scrap",
        price:25,
        unit:"kg",
        emoji:"⚙️"
    },

    {
        id:"battery",
        name:"Old Battery",
        price:50,
        unit:"kg",
        emoji:"🔋"
    },

    {
        id:"ewaste",
        name:"E-Waste",
        price:15,
        unit:"kg",
        emoji:"💻"
    },

    {
        id:"mixed",
        name:"Mixed Scrap",
        price:20,
        unit:"kg",
        emoji:"♻️"
    }

];



/* =====================================================
   EMOJI MAP
===================================================== */

const emojiMap =
    Object.fromEntries(
        defaults.map(
            item =>
                [
                    item.id,
                    item.emoji
                ]
        )
    );



/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,

        function(match){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[match];

        }
    );

}



/* =====================================================
   DATE FORMAT
===================================================== */

function dateText(value){

    if(!value){

        return "Never updated";

    }


    const date =
        new Date(
            value
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return String(
            value
        );

    }


    return date.toLocaleDateString(
        "en-IN",
        {

            day:"2-digit",
            month:"short",
            year:"numeric",

            hour:"2-digit",
            minute:"2-digit"

        }
    );

}



/* =====================================================
   TOAST
===================================================== */

function toast(message){

    const t =
        document.getElementById(
            "toast"
        );


    t.textContent =
        message;


    t.classList.add(
        "show"
    );


    clearTimeout(
        window.toastTimer
    );


    window.toastTimer =
        setTimeout(

            function(){

                t.classList.remove(
                    "show"
                );

            },

            2200

        );

}



/* =====================================================
   SAFE FIREBASE ID
===================================================== */

function slug(value){

    return String(
        value
    )
    .toLowerCase()
    .trim()
    .replace(
        /[^a-z0-9]+/g,
        "-"
    )
    .replace(
        /^-|-$/g,
        ""
    )
    ||
    Date.now().toString();

}



/* =====================================================
   CREATE DEFAULT RATES
===================================================== */

async function ensureDefaults(){

    const snapshot =
        await new Promise(

            function(resolve){

                onValue(

                    ratesRef,

                    resolve,

                    {
                        onlyOnce:true
                    }

                );

            }

        );


    const existing =
        snapshot.val();


    /*
       If rates already exist,
       DO NOT overwrite them.
    */

    if(

        existing &&
        existing.rates

    ){

        return;

    }


    const rates = {};


    defaults.forEach(

        function(item){

            rates[item.id] = {

                name:
                    item.name,

                price:
                    item.price,

                unit:
                    item.unit

            };

        }

    );


    await set(

        ratesRef,

        {

            rates:

                rates,

            lastUpdated:

                new Date().toISOString()

        }

    );

}



/* =====================================================
   RENDER RATES
===================================================== */

function render(data){

    const loading =
        document.getElementById(
            "loading"
        );


    loading.style.display =
        "none";


    const rates =
        data?.rates || {};


    document.getElementById(
        "updateDate"
    ).textContent =

        "Last updated • " +

        dateText(
            data?.lastUpdated
        );


    const box =
        document.getElementById(
            "ratesContainer"
        );


    const keys =
        Object.keys(
            rates
        );


    if(!keys.length){

        box.innerHTML = `

            <div class="panel">

                No rates available.

            </div>

        `;

        return;

    }


    box.innerHTML =

        keys.map(

            function(id){

                const rate =
                    rates[id] || {};


                const price =
                    Number(
                        rate.price || 0
                    );


                return `

                    <div
                        class="rate-item"
                    >


                        <div
                            class="icon"
                        >

                            ${
                                emojiMap[id]
                                ||
                                "♻️"
                            }

                        </div>


                        <div>

                            <div
                                class="name"
                            >

                                ${
                                    esc(
                                        rate.name
                                        ||
                                        id
                                    )
                                }

                            </div>


                            <div
                                class="unit"
                            >

                                per
                                ${
                                    esc(
                                        rate.unit
                                        ||
                                        "kg"
                                    )
                                }

                            </div>

                        </div>


                        <input

                            class="price-input"

                            type="number"

                            min="0"

                            step="0.01"

                            id="price-${esc(id)}"

                            value="${
                                price.toFixed(2)
                            }"

                        >


                        <button

                            class="
                                btn
                                btn-blue
                                small-btn
                                update-rate
                            "

                            data-id="${esc(id)}"

                        >

                            Save

                        </button>


                        <button

                            class="
                                btn
                                btn-red
                                small-btn
                                delete-rate
                            "

                            data-id="${esc(id)}"

                        >

                            Delete

                        </button>


                    </div>

                `;

            }

        ).join("");

}



/* =====================================================
   REALTIME LISTENER
===================================================== */

onValue(

    ratesRef,

    function(snapshot){

        const data =
            snapshot.val();


        render(
            data
        );

    },

    function(error){

        console.error(
            "Firebase Realtime Database error:",
            error
        );


        const loading =
            document.getElementById(
                "loading"
            );


        loading.innerHTML = `

            ❌ Unable to load rates.

            <br><br>

            <small>

                ${
                    esc(
                        error.message
                    )
                }

            </small>

        `;

    }

);



/* =====================================================
   INITIALIZE DEFAULTS
===================================================== */

ensureDefaults()
.catch(

    function(error){

        console.error(
            "Default rate setup error:",
            error
        );

    }

);



/* =====================================================
   SAVE / DELETE RATE
===================================================== */

document
.getElementById(
    "ratesContainer"
)
.addEventListener(

    "click",

    async function(event){

        const saveButton =
            event.target.closest(
                ".update-rate"
            );


        const deleteButton =
            event.target.closest(
                ".delete-rate"
            );


        /* =============================================
           SAVE ONE RATE
        ============================================= */

        if(saveButton){

            const id =
                saveButton.dataset.id;


            const input =
                document.getElementById(
                    "price-" + id
                );


            const price =
                parseFloat(
                    input.value
                );


            if(

                !Number.isFinite(
                    price
                )

                ||

                price < 0

            ){

                toast(
                    "Enter a valid price"
                );

                return;

            }


            saveButton.disabled =
                true;


            try{

                /*
                   Save only the price.
                */

                await update(

                    ref(
                        db,
                        "scrapRates/rates/" +
                        id
                    ),

                    {

                        price:
                            price

                    }

                );


                /*
                   Update timestamp.
                */

                await set(

                    ref(
                        db,
                        "scrapRates/lastUpdated"
                    ),

                    new Date()
                    .toISOString()

                );


                toast(
                    "✓ Rate updated"
                );

            }

            catch(error){

                console.error(
                    "Rate update error:",
                    error
                );


                toast(
                    "❌ Update failed"
                );

            }

            finally{

                saveButton.disabled =
                    false;

            }

        }



        /* =============================================
           DELETE RATE
        ============================================= */

        if(deleteButton){

            const id =
                deleteButton.dataset.id;


            if(
                !confirm(
                    "Delete this material rate?"
                )
            ){

                return;

            }


            try{

                await remove(

                    ref(
                        db,
                        "scrapRates/rates/" +
                        id
                    )

                );


                await set(

                    ref(
                        db,
                        "scrapRates/lastUpdated"
                    ),

                    new Date()
                    .toISOString()

                );


                toast(
                    "✓ Rate deleted"
                );

            }

            catch(error){

                console.error(
                    "Rate delete error:",
                    error
                );


                toast(
                    "❌ Delete failed"
                );

            }

        }

    }

);



/* =====================================================
   ADD NEW MATERIAL
===================================================== */

document
.getElementById(
    "addBtn"
)
.onclick =

async function(){

    const name =
        document
        .getElementById(
            "materialName"
        )
        .value
        .trim();


    const price =
        parseFloat(

            document
            .getElementById(
                "materialPrice"
            )
            .value

        );


    const unit =
        document
        .getElementById(
            "materialUnit"
        )
        .value
        .trim()
        ||
        "kg";


    if(

        !name

        ||

        !Number.isFinite(
            price
        )

        ||

        price < 0

    ){

        toast(
            "Enter material and valid price"
        );

        return;

    }


    const id =
        slug(name) +
        "-" +
        Date.now();


    try{

        await update(

            ref(
                db,
                "scrapRates"
            ),

            {

                [`rates/${id}`]:

                    {

                        name:
                            name,

                        price:
                            price,

                        unit:
                            unit

                    },


                lastUpdated:

                    new Date()
                    .toISOString()

            }

        );


        document
        .getElementById(
            "materialName"
        )
        .value = "";


        document
        .getElementById(
            "materialPrice"
        )
        .value = "";


        document
        .getElementById(
            "materialUnit"
        )
        .value = "kg";


        toast(
            "✓ Rate added"
        );

    }

    catch(error){

        console.error(
            "Add rate error:",
            error
        );


        toast(
            "❌ Add failed"
        );

    }

};



/* =====================================================
   UPDATE ALL RATES
===================================================== */

document
.getElementById(
    "updateAllBtn"
)
.onclick =

async function(){

    const inputs =
        [
            ...
            document.querySelectorAll(
                ".price-input"
            )
        ];


    const updates = {};


    for(

        const input
        of inputs

    ){

        const id =
            input.id.replace(
                "price-",
                ""
            );


        const price =
            parseFloat(
                input.value
            );


        if(

            !Number.isFinite(
                price
            )

            ||

            price < 0

        ){

            toast(
                "Check all prices"
            );

            return;

        }


        updates[
            `rates/${id}/price`
        ] =
            price;

    }


    try{

        await update(

            ratesRef,

            {

                ...updates,

                lastUpdated:

                    new Date()
                    .toISOString()

            }

        );


        toast(
            "✓ All rates updated"
        );

    }

    catch(error){

        console.error(
            "Update all error:",
            error
        );


        toast(
            "❌ Update All failed"
        );

    }

};


</script>


</body>

</html>
