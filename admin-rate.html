<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta name="theme-color" content="#087c4d">

<title>Admin Rates | COVAI SCRAP HUB</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --green:#0aa66f;
    --green-dark:#047857;
    --green-deep:#065f46;
    --blue:#2563eb;
    --bg:#f3faf6;
    --white:#ffffff;
    --text:#10231b;
    --muted:#718079;
    --border:#dcebe3;
    --danger:#dc2626;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            #d8fbe7 0,
            transparent 28%
        ),
        radial-gradient(
            circle at 100% 15%,
            #e3fff0 0,
            transparent 28%
        ),
        var(--bg);

    -webkit-font-smoothing:antialiased;
}


/* =========================
   TOP BAR
========================= */

.topbar{
    position:sticky;
    top:0;
    z-index:100;

    padding:
        8px
        10px;

    background:
        rgba(255,255,255,.93);

    border-bottom:
        1px solid var(--border);

    backdrop-filter:
        blur(18px);
}

.topbar-inner{
    width:min(100%,760px);

    margin:auto;

    display:flex;
    align-items:center;

    gap:9px;
}

.back-btn{
    width:35px;
    height:35px;

    border:
        1px solid var(--border);

    border-radius:10px;

    background:#fff;

    color:var(--green-dark);

    display:grid;
    place-items:center;

    font-size:19px;

    cursor:pointer;

    transition:.2s;
}

.back-btn:hover{
    transform:translateY(-1px);
}

.page-title{
    font-size:15px;
    font-weight:900;
}


/* =========================
   MAIN
========================= */

.container{
    width:
        min(
            calc(100% - 16px),
            760px
        );

    margin:auto;

    padding:
        9px
        0
        30px;
}


/* =========================
   HERO
========================= */

.hero{
    position:relative;

    overflow:hidden;

    display:flex;
    align-items:center;

    gap:10px;

    padding:14px;

    margin-bottom:9px;

    color:#fff;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #047857 72%,
            #065f46
        );

    box-shadow:
        0 12px 30px
        rgba(5,150,105,.20);
}

.hero::after{
    content:"";

    position:absolute;

    width:150px;
    height:150px;

    right:-65px;
    top:-70px;

    border-radius:50%;

    background:
        rgba(255,255,255,.10);
}

.hero-content{
    position:relative;
    z-index:2;

    flex:1;

    min-width:0;
}

.hero-label{
    font-size:8px;

    font-weight:900;

    letter-spacing:.12em;
}

.hero-title{
    margin-top:3px;

    font-size:16px;

    font-weight:900;
}

.hero-date{
    margin-top:4px;

    font-size:9px;

    opacity:.82;
}

.update-all{
    position:relative;
    z-index:3;

    flex-shrink:0;

    padding:
        9px
        11px;

    border:
        1px solid
        rgba(255,255,255,.25);

    border-radius:10px;

    background:
        rgba(255,255,255,.18);

    color:#fff;

    font-size:9px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.update-all:hover{
    background:
        rgba(255,255,255,.28);
}

.update-all:disabled{
    opacity:.55;
    cursor:not-allowed;
}


/* =========================
   INFO
========================= */

.info{
    display:flex;
    align-items:center;

    gap:9px;

    padding:9px;

    margin-bottom:9px;

    background:#fff;

    border:
        1px solid
        var(--border);

    border-radius:12px;

    box-shadow:
        0 4px 14px
        rgba(15,80,50,.04);
}

.info-icon{
    width:30px;
    height:30px;

    flex:0 0 30px;

    display:grid;
    place-items:center;

    border-radius:9px;

    background:#ecfdf5;

    font-size:15px;
}

.info-text{
    font-size:9px;

    line-height:1.45;

    color:var(--muted);
}

.info-text strong{
    color:var(--text);
}


/* =========================
   FIRESTORE STATUS
========================= */

.status{
    display:flex;
    align-items:center;

    gap:7px;

    padding:8px 10px;

    margin-bottom:9px;

    border:
        1px solid
        #dcebe3;

    border-radius:10px;

    background:#fff;

    font-size:9px;

    color:var(--muted);
}

.status-dot{
    width:8px;
    height:8px;

    flex:0 0 8px;

    border-radius:50%;

    background:#f59e0b;
}

.status.ok .status-dot{
    background:#10b981;
}

.status.error .status-dot{
    background:#ef4444;
}

.status strong{
    color:var(--text);
}


/* =========================
   RATE CARD
========================= */

.rate-card{
    display:grid;

    grid-template-columns:
        40px
        minmax(0,1fr)
        110px
        62px;

    align-items:center;

    gap:8px;

    padding:8px;

    margin-bottom:7px;

    background:#fff;

    border:
        1px solid
        var(--border);

    border-radius:13px;

    box-shadow:
        0 4px 14px
        rgba(15,80,50,.045);

    animation:
        cardIn .25s ease both;
}

@keyframes cardIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.product-icon{
    width:40px;
    height:40px;

    display:grid;
    place-items:center;

    border-radius:11px;

    background:
        linear-gradient(
            145deg,
            #effdf5,
            #d8f8e5
        );

    font-size:20px;
}

.product-name{
    font-size:11px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.product-unit{
    margin-top:2px;

    font-size:8px;

    color:var(--muted);
}

.price-box{
    position:relative;
}

.rupee{
    position:absolute;

    left:8px;
    top:50%;

    transform:
        translateY(-50%);

    color:var(--green-dark);

    font-size:11px;

    font-weight:900;

    pointer-events:none;
}

.price-input{
    width:100%;
    height:34px;

    padding:
        0
        6px
        0
        21px;

    border:
        1px solid
        var(--border);

    border-radius:9px;

    background:#fbfefc;

    color:var(--text);

    text-align:right;

    font-size:11px;

    font-weight:800;

    outline:none;

    -moz-appearance:textfield;
}

.price-input::-webkit-inner-spin-button,
.price-input::-webkit-outer-spin-button{
    -webkit-appearance:none;
    margin:0;
}

.price-input:focus{
    border-color:var(--green);

    box-shadow:
        0 0 0 3px
        rgba(16,185,129,.10);
}

.save-btn{
    width:100%;
    height:34px;

    border:0;

    border-radius:9px;

    background:var(--blue);

    color:#fff;

    font-size:8px;

    font-weight:900;

    cursor:pointer;

    transition:.2s;
}

.save-btn:hover{
    filter:brightness(.95);
}

.save-btn:disabled{
    opacity:.55;

    cursor:not-allowed;
}


/* =========================
   LOADING
========================= */

.loading{
    padding:35px;

    text-align:center;

    color:var(--muted);

    font-size:10px;
}

.spinner{
    width:25px;
    height:25px;

    margin:
        0
        auto
        8px;

    border:
        3px solid
        #d8eee2;

    border-top-color:
        var(--green);

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================
   ERROR
========================= */

.error{
    display:none;

    padding:10px;

    margin-bottom:9px;

    border:
        1px solid
        #fecaca;

    border-radius:11px;

    background:#fff5f5;

    color:#b42318;

    font-size:9px;

    line-height:1.5;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:17px;

    z-index:9999;

    max-width:
        calc(100% - 25px);

    padding:
        10px
        14px;

    border-radius:10px;

    background:#10231b;

    color:#fff;

    text-align:center;

    font-size:9px;

    font-weight:900;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,20px);

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{
        width:
            calc(100% - 12px);

        padding-top:7px;
    }

    .hero{
        padding:11px;

        border-radius:14px;
    }

    .hero-title{
        font-size:14px;
    }

    .hero-label{
        font-size:7px;
    }

    .hero-date{
        font-size:8px;
    }

    .update-all{
        padding:
            8px
            9px;

        font-size:8px;
    }

    .rate-card{
        grid-template-columns:
            36px
            minmax(0,1fr)
            82px
            56px;

        gap:6px;

        padding:7px;

        border-radius:11px;
    }

    .product-icon{
        width:36px;
        height:36px;

        font-size:18px;
    }

    .product-name{
        font-size:10px;
    }

    .product-unit{
        font-size:7px;
    }

    .price-input,
    .save-btn{
        height:32px;
    }

    .price-input{
        font-size:10px;
    }

    .save-btn{
        font-size:7px;
    }

}

@media(max-width:360px){

    .rate-card{
        grid-template-columns:
            33px
            minmax(0,1fr)
            69px
            51px;

        gap:5px;
    }

    .product-icon{
        width:33px;
        height:33px;

        font-size:16px;
    }

    .product-name{
        font-size:9px;
    }

    .price-input{
        font-size:9px;
    }

    .save-btn{
        font-size:6px;
    }

}

</style>

</head>


<body>


<header class="topbar">

    <div class="topbar-inner">

        <button
            class="back-btn"
            type="button"
            onclick="history.back()"
            aria-label="Go back"
        >
            ←
        </button>

        <div class="page-title">
            Manage Scrap Rates
        </div>

    </div>

</header>


<main class="container">


<section class="hero">

    <div class="hero-content">

        <div class="hero-label">
            COVAI SCRAP HUB • ADMIN
        </div>

        <div class="hero-title">
            Update Product Rates
        </div>

        <div
            class="hero-date"
            id="updateDate"
        >
            Loading rates...
        </div>

    </div>

    <button
        class="update-all"
        id="updateAllBtn"
        type="button"
    >
        UPDATE ALL
    </button>

</section>


<section class="info">

    <div class="info-icon">
        💰
    </div>

    <div class="info-text">

        <strong>
            10 fixed products
        </strong>

        — only the price can be changed.
        Product names and product IDs are fixed.

    </div>

</section>


<div
    class="status"
    id="status"
>

    <span class="status-dot"></span>

    <span id="statusText">
        Connecting to Firestore...
    </span>

</div>


<div
    class="loading"
    id="loading"
>

    <div class="spinner"></div>

    Loading rates...

</div>


<div
    class="error"
    id="error"
></div>


<section
    id="ratesContainer"
></section>


</main>


<div
    class="toast"
    id="toast"
></div>


<script type="module">


/* =====================================================
   FIREBASE FIRESTORE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getFirestore,
    doc,
    onSnapshot,
    setDoc
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* =====================================================
   YOUR EXACT FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyApJhYmo0pHNqVD0XIyOlQDqDzACztPdHA",

    authDomain:
        "covai-scrap-hub.firebaseapp.com",

    databaseURL:
        "https://covai-scrap-hub-default-rtdb.firebaseio.com",

    projectId:
        "covai-scrap-hub",

    storageBucket:
        "covai-scrap-hub.firebasestorage.app",

    messagingSenderId:
        "979133721874",

    appId:
        "1:979133721874:web:c5829bb8dbf5270c0917cb",

    measurementId:
        "G-P3PTSBHWMF"
};


/* =====================================================
   FIREBASE INIT
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getFirestore(app);


/* =====================================================
   YOUR EXISTING FIRESTORE DOCUMENT
===================================================== */

const ratesDocument =
    doc(
        db,
        "covai hub",
        "f9k5K0JaYiXmE8aZ5vdf"
    );


/* =====================================================
   EXACTLY 10 FIXED PRODUCTS
===================================================== */

const PRODUCTS = [

    {
        id:"steel",
        name:"Steel Scrap",
        unit:"kg",
        emoji:"🔩"
    },

    {
        id:"paper",
        name:"Paper Scrap",
        unit:"kg",
        emoji:"📰"
    },

    {
        id:"aluminium",
        name:"Aluminium Scrap",
        unit:"kg",
        emoji:"🥫"
    },

    {
        id:"copper",
        name:"Copper Scrap",
        unit:"kg",
        emoji:"🔶"
    },

    {
        id:"plastic",
        name:"Plastic Scrap",
        unit:"kg",
        emoji:"📦",

        /*
         Your existing Firestore screenshot
         shows "palstic".
         Support both names.
        */

        legacyId:"palstic"
    },

    {
        id:"brass",
        name:"Brass Scrap",
        unit:"kg",
        emoji:"🔔"
    },

    {
        id:"iron",
        name:"Iron Scrap",
        unit:"kg",
        emoji:"⚙️"
    },

    {
        id:"battery",
        name:"Old Battery",
        unit:"kg",
        emoji:"🔋"
    },

    {
        id:"ewaste",
        name:"E-Waste",
        unit:"kg",
        emoji:"💻"
    },

    {
        id:"mixed",
        name:"Mixed Scrap",
        unit:"kg",
        emoji:"♻️"
    }

];


/* =====================================================
   GLOBAL DATA
===================================================== */

let currentData = {};


/* =====================================================
   ELEMENTS
===================================================== */

const container =
    document.getElementById(
        "ratesContainer"
    );


const loading =
    document.getElementById(
        "loading"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const status =
    document.getElementById(
        "status"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const toast =
    document.getElementById(
        "toast"
    );


const updateDate =
    document.getElementById(
        "updateDate"
    );


const updateAllBtn =
    document.getElementById(
        "updateAllBtn"
    );


/* =====================================================
   TOAST
===================================================== */

function showToast(message){

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.__toastTimer
    );

    window.__toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2600
        );
}


/* =====================================================
   DATE FORMAT
===================================================== */

function formatDate(value){

    if(!value){
        return "Rates not updated yet";
    }

    let date;

    if(
        value &&
        typeof value.toDate === "function"
    ){

        date =
            value.toDate();

    }
    else{

        date =
            new Date(value);

    }


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Rates not updated yet";

    }


    return (
        "Last updated • " +
        date.toLocaleDateString(
            "en-IN",
            {
                day:"2-digit",
                month:"short",
                year:"numeric"
            }
        ) +
        " " +
        date.toLocaleTimeString(
            "en-IN",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
    );
}


/* =====================================================
   GET PRICE
===================================================== */

function getProductPrice(
    product,
    data
){

    if(!data){
        return 0;
    }


    /*
       First use the new correct ID.
    */

    if(
        data[product.id] !== undefined
    ){

        const value =
            Number(
                data[product.id]
            );

        if(
            Number.isFinite(value)
        ){

            return value;

        }

    }


    /*
       Then support the old "palstic"
       field in your existing Firestore.
    */

    if(
        product.legacyId &&
        data[product.legacyId] !== undefined
    ){

        const value =
            Number(
                data[product.legacyId]
            );

        if(
            Number.isFinite(value)
        ){

            return value;

        }

    }


    return 0;
}


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(
    data
){

    let html = "";


    PRODUCTS.forEach(
        (
            product,
            index
        ) => {

            const price =
                getProductPrice(
                    product,
                    data
                );


            html += `

                <div
                    class="rate-card"
                    style="
                        animation-delay:
                        ${index * 30}ms
                    "
                >

                    <div class="product-icon">
                        ${product.emoji}
                    </div>


                    <div>

                        <div class="product-name">
                            ${product.name}
                        </div>

                        <div class="product-unit">
                            Per ${product.unit}
                        </div>

                    </div>


                    <div class="price-box">

                        <span class="rupee">
                            ₹
                        </span>

                        <input
                            class="price-input"
                            id="price-${product.id}"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            value="${price}"
                            aria-label="${product.name} price"
                        >

                    </div>


                    <button
                        class="save-btn"
                        type="button"
                        data-product="${product.id}"
                    >
                        SAVE
                    </button>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;


    updateDate.textContent =
        formatDate(
            data.lastUpdated
        );
}


/* =====================================================
   FIRESTORE REAL-TIME LISTENER
===================================================== */

onSnapshot(

    ratesDocument,

    snapshot => {

        /*
           If the document exists,
           use its fields.

           If it does not exist,
           simply show all 10 products
           with ₹0.
        */

        currentData =
            snapshot.exists()
                ? (
                    snapshot.data() || {}
                )
                : {};


        renderProducts(
            currentData
        );


        loading.style.display =
            "none";


        errorBox.style.display =
            "none";


        status.classList.remove(
            "error"
        );

        status.classList.add(
            "ok"
        );


        statusText.innerHTML =
            "<strong>Connected</strong> • Firestore rates are live";

    },

    error => {

        console.error(
            "Firestore error:",
            error
        );


        /*
           Still show the 10 fixed products.
        */

        currentData = {};

        renderProducts(
            currentData
        );


        loading.style.display =
            "none";


        status.classList.remove(
            "ok"
        );

        status.classList.add(
            "error"
        );


        statusText.textContent =
            "Firestore permission error";


        errorBox.style.display =
            "block";


        if(
            error.code ===
            "permission-denied"
        ){

            errorBox.innerHTML =
                "⚠️ Firestore permission denied. " +
                "Your Firestore Security Rules are blocking this page from reading the rates.";

        }
        else{

            errorBox.innerHTML =
                "⚠️ Firestore connection failed. " +
                error.message;

        }

    }

);


/* =====================================================
   SAVE ONE PRODUCT
===================================================== */

container.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                ".save-btn"
            );


        if(!button){
            return;
        }


        const productId =
            button.dataset.product;


        const product =
            PRODUCTS.find(
                item =>
                    item.id ===
                    productId
            );


        if(!product){
            return;
        }


        const input =
            document.getElementById(
                "price-" +
                productId
            );


        const price =
            Number(
                input.value
            );


        if(
            !Number.isFinite(price) ||
            price < 0
        ){

            showToast(
                "Enter a valid price"
            );

            input.focus();

            return;

        }


        button.disabled =
            true;

        button.textContent =
            "SAVING";


        try{

            /*
               IMPORTANT:

               setDoc(..., {merge:true})
               works even if the field
               does not currently exist.

               This is better than updateDoc
               for your existing document.
            */

            const dataToSave = {};


            dataToSave[
                product.id
            ] =
                price;


            /*
               For plastic, keep the existing
               "palstic" field synchronized too.
            */

            if(
                product.id ===
                "plastic"
            ){

                dataToSave.palstic =
                    price;

            }


            dataToSave.lastUpdated =
                new Date();


            await setDoc(
                ratesDocument,
                dataToSave,
                {
                    merge:true
                }
            );


            showToast(
                "✓ " +
                product.name +
                " updated"
            );

        }
        catch(error){

            console.error(
                error
            );


            if(
                error.code ===
                "permission-denied"
            ){

                showToast(
                    "❌ Firestore permission denied"
                );

            }
            else{

                showToast(
                    "❌ Save failed"
                );

            }

        }
        finally{

            button.disabled =
                false;

            button.textContent =
                "SAVE";

        }

    }
);


/* =====================================================
   UPDATE ALL 10
===================================================== */

updateAllBtn.addEventListener(
    "click",
    async () => {

        const dataToSave = {};


        for(
            const product of PRODUCTS
        ){

            const input =
                document.getElementById(
                    "price-" +
                    product.id
                );


            const price =
                Number(
                    input.value
                );


            if(
                !Number.isFinite(price) ||
                price < 0
            ){

                showToast(
                    "Invalid price: " +
                    product.name
                );


                input.focus();

                return;

            }


            dataToSave[
                product.id
            ] =
                price;


            /*
               Preserve your existing
               Firestore "palstic" field.
            */

            if(
                product.id ===
                "plastic"
            ){

                dataToSave.palstic =
                    price;

            }

        }


        dataToSave.lastUpdated =
            new Date();


        updateAllBtn.disabled =
            true;


        updateAllBtn.textContent =
            "SAVING...";


        try{

            await setDoc(
                ratesDocument,
                dataToSave,
                {
                    merge:true
                }
            );


            showToast(
                "✓ All 10 prices updated"
            );

        }
        catch(error){

            console.error(
                error
            );


            if(
                error.code ===
                "permission-denied"
            ){

                showToast(
                    "❌ Firestore permission denied"
                );

            }
            else{

                showToast(
                    "❌ Update failed"
                );

            }

        }
        finally{

            updateAllBtn.disabled =
                false;

            updateAllBtn.textContent =
                "UPDATE ALL";

        }

    }
);

</script>
