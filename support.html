body{
    font-family:"DM Sans",sans-serif;
    background:var(--bg);
    color:var(--text);
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    transition:background .3s ease,color .3s ease;
}

/* ================= HEADER ================= */

.topbar{
    height:65px;
    background:#fff;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    flex-shrink:0;
    box-shadow:0 2px 8px rgba(20,50,30,.04);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:var(--text);
}

.brand-logo{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--green);
}

.brand h2{
    font-family:"Manrope",sans-serif;
    font-size:17px;
    font-weight:800;
}

.brand h2 span{
    color:var(--green);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.lang-toggle{
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:10px;
    font-weight:700;
}

.lang-toggle:hover{
    background:var(--light-green);
    color:var(--green);
}

.header-btn{
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    width:38px;
    height:38px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.header-btn:hover{
    background:var(--light-green);
    color:var(--green);
}

/* ================= CHAT CONTAINER ================= */

.chat-container{
    flex:1;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
}

.chat-content{
    width:100%;
    max-width:800px;
    margin:0 auto;
    padding:20px;
}

/* ================= MESSAGES ================= */

.message{
    display:flex;
    margin-bottom:20px;
    animation:fadeIn .3s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.message.user{
    justify-content:flex-end;
}

.message-inner{
    display:flex;
    gap:10px;
    max-width:85%;
}

.user .message-inner{
    flex-direction:row-reverse;
}

.message-avatar{
    width:32px;
    height:32px;
    min-width:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    flex-shrink:0;
}

.bot .message-avatar{
    background:linear-gradient(135deg,#149447,#087536);
    color:#fff;
}

.user .message-avatar{
    background:#e8e8e8;
}

.bubble{
    padding:12px 16px;
    border-radius:16px;
    font-size:14px;
    line-height:1.6;
}

.bot .bubble{
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 2px 8px rgba(20,50,30,.04);
}

.user .bubble{
    background:var(--green);
    color:#fff;
}

.bubble strong{
    font-weight:700;
}

.bubble br{
    display:block;
    margin:4px 0;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    align-items:center;
    gap:4px;
    padding:12px 16px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:16px;
}

.typing span{
    width:6px;
    height:6px;
    background:#9ca9a1;
    border-radius:50%;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.4;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* ================= QUICK ACTIONS ================= */

.quick-actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:15px 0;
}

.quick-btn{
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    border-radius:20px;
    padding:8px 14px;
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.quick-btn:hover{
    background:var(--green);
    color:#fff;
    border-color:var(--green);
}

/* ================= INPUT AREA ================= */

.input-area{
    background:#fff;
    border-top:1px solid var(--border);
    padding:15px 20px;
    flex-shrink:0;
}

.input-wrapper{
    width:100%;
    max-width:800px;
    margin:0 auto;
}

.input-box{
    display:flex;
    align-items:flex-end;
    gap:10px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    padding:8px;
}

.input-box textarea{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    color:var(--text);
    padding:8px;
    resize:none;
    max-height:120px;
    min-height:40px;
}

.input-box textarea::placeholder{
    color:#9aa59f;
}

.send-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:8px;
    background:var(--green);
    color:#fff;
    cursor:pointer;
    font-size:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.send-btn:hover{
    background:var(--dark-green);
}

.send-btn:disabled{
    background:#ccc;
    cursor:not-allowed;
}

.input-note{
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
    text-align:center;
}


/* ================= MOBILE ================= */

@media(max-width:768px){

    .message-inner{

    }

    .message-avatar{
        width:28px;
        height:28px;
        min-width:28px;
        font-size:14px;
    }

    .bubble{
        font-size:13px;

    }

    .input-area{

}

let currentLang = "english";


/* =====================================================
   TOGGLE LANGUAGE
===================================================== */

function toggleLanguage(){

    currentLang = currentLang === "english" ? "tamil" : "english";

    const btn = document.getElementById("langBtn");

    btn.textContent = currentLang === "tamil" ? "🇮🇳 தமிழ்" : "🇬🇧 EN";

    const msg = currentLang === "tamil"
        ? "தமிழ் மொழி தேர்வு செய்யப்பட்டது"
        : "English selected";

    addBotMessage(msg, false);

}


/* =====================================================
   SEARCH FAQ
===================================================== */

function searchFAQ(input){

    const text = input.toLowerCase().trim();

    if(!text) return null;

    let bestMatch = null;
    let bestScore = 0;

    for(const key in faq){

        if(key === "default") continue;

        const keywords = key.split(" ");

        let score = 0;

        keywords.forEach(keyword => {
            if(text.includes(keyword)){
                score += keyword.length;
            }
        });

        const words = text.split(/\s+/);

        words.forEach(word => {
            if(word.length >= 3 && key.includes(word)){
                score += 2;
            }
        });

        if(score > bestScore){
            bestScore = score;
            bestMatch = key;
        }

    }

    return bestScore >= 3 ? bestMatch : null;

}

/* =====================================================
   ADD MESSAGES
===================================================== */

function addBotMessage(text, showQuick = true){

    const content = document.getElementById("chatContent");

    const msg = document.createElement("div");

    msg.className = "message bot";

    msg.innerHTML = `
        <div class="message-inner">
            <div class="message-avatar">🤖</div>
            <div class="bubble">${text}</div>
        </div>
    `;

    content.appendChild(msg);

    scrollToBottom();

    if(showQuick){
        showQuickActions();
    }

}


function addUserMessage(text){

    const content = document.getElementById("chatContent");

    const msg = document.createElement("div");

    msg.className = "message user";

    msg.innerHTML = `
        <div class="message-inner">
            <div class="message-avatar">👤</div>
            <div class="bubble">${escapeHTML(text)}</div>
        </div>
    `;

    content.appendChild(msg);

    scrollToBottom();

}


/* =====================================================
   TYPING
===================================================== */

function showTyping(){

    const content = document.getElementById("chatContent");

    const msg = document.createElement("div");

    msg.className = "message bot";
    msg.id = "typingMsg";

    msg.innerHTML = `
        <div class="message-inner">
            <div class="message-avatar">🤖</div>
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    content.appendChild(msg);

    scrollToBottom();

}


function removeTyping(){

    const typing = document.getElementById("typingMsg");

    if(typing){
        typing.remove();
    }

}


/* =====================================================
   QUICK ACTIONS
===================================================== */

function showQuickActions(){

    const existing = document.querySelector(".quick-actions");

    if(existing){
        existing.remove();
    }

    const content = document.getElementById("chatContent");

    const actions = document.createElement("div");

    actions.className = "quick-actions";

    const suggestions = quickSuggestions[currentLang] || quickSuggestions.english;

    suggestions.forEach(q => {

        const btn = document.createElement("button");

        btn.className = "quick-btn";

        btn.textContent = q;

        btn.onclick = () => {
            document.getElementById("questionInput").value = q;
            sendQuestion();
        };

        actions.appendChild(btn);

    });

    content.appendChild(actions);

    scrollToBottom();

}


/* =====================================================
   SEND QUESTION
===================================================== */

function sendQuestion(){

    const input = document.getElementById("questionInput");

    const text = input.value.trim();

    if(!text) return;

    addUserMessage(text);

    input.value = "";
    input.style.height = "auto";

    showTyping();

    setTimeout(() => {

        removeTyping();

        const matchKey = searchFAQ(text);

        if(matchKey && faq[matchKey]){

            const answer = faq[matchKey][currentLang === "tamil" ? "ta" : "en"];

            addBotMessage(answer);

        }
        else{

            const defaultAnswer = faq.default[currentLang === "tamil" ? "ta" : "en"];

            addBotMessage(defaultAnswer);

        }

    }, 600);

}


/* =====================================================
   INPUT HANDLERS
===================================================== */

function handleKey(e){

    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendQuestion();
    }

}


function autoResize(textarea){

    textarea.style.height = "auto";
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + "px";

}


/* =====================================================
   UTILS
===================================================== */

function escapeHTML(str){

    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function scrollToBottom(){

    const container = document.getElementById("chatContainer");

    setTimeout(() => {
        container.scrollTop = container.scrollHeight;
    }, 50);

}

welcomeMessage();
