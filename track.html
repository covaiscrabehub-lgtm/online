<style>

    box-sizing:border-box;
    margin:0;
    padding:0;
}

    --green:#00a86b;
    --green-dark:#008653;
    --green-light:#e9fff6;
    --green-soft:#f5fffb;
    --dark:#111827;
    --text:#27332e;
    --muted:#718078;
    --border:#e5ebe8;
    --bg:#f5f8f7;
    --white:#fff;
    --red:#ef4444;
    --orange:#f59e0b;
    --blue:#3b82f6;
    --shadow:0 12px 35px rgba(15,23,42,.08);
}

    --green:#34d399;
    --green-dark:#10b981;
    --green-light:#1f2937;

    --white:#1f2937;
    --red:#ef4444;
    --orange:#fb923c;
    --blue:#60a5fa;
    --shadow:0 12px 35px rgba(0,0,0,.25);
}

    background:linear-gradient(135deg,#0f1419,#1a1f26);

}

}

}

    color:#e0e6ed;
}

body.dark-mode .brand-sub{

}

body.dark-mode .brand-logo{
    background:#1e2433;
    border:3px solid #34d399;
}

body.dark-mode .back-btn{
    background:#1e2433;
    border:1px solid #374151;
    color:#34d399;
}

body.dark-mode .back-btn:hover{
    background:#1a7f4e;
    color:#fff;
}

body.dark-mode .pickup-form{
    background:#1a1f2e;

}

}

}

body.dark-mode .input-label{

}

body.dark-mode .phone-wrapper{
    background:#1e2433;
    border:1px solid #374151;
}

body.dark-mode .phone-icon{
    color:#9ca3af;
}

body.dark-mode .phone-input{
    background:transparent;
    color:#e0e6ed;
}

body.dark-mode .phone-input::placeholder{

}

}

body.dark-mode .main-btn{

}

body.dark-mode .main-btn:hover{
    background:linear-gradient(135deg,#16a34a,#059669);
}

body.dark-mode .or-divider::before,
body.dark-mode .or-divider::after{
    border-bottom-color:#374151;
}

body.dark-mode .secondary-btn{

}

}

body.dark-mode .phone-note{
    background:rgba(26,127,78,.1);
    border:1px solid rgba(52,211,153,.2);
    color:#9ca3af;
}

body.dark-mode .phone-note-icon{

}

body.dark-mode .how-title{

}

body.dark-mode .step{
    background:#1a1f2e;
    border:1px solid #374151;
}

body.dark-mode .step-icon{
    background:rgba(26,127,78,.2);
    color:#34d399;
}

body.dark-mode .step-title{
    color:#e0e6ed;
}

body.dark-mode .step-content{
    color:#9ca3af;
}

body.dark-mode .message-box{
    background:#1e2433;
    border:1px solid #374151;
}

body.dark-mode .message-error{
    background:rgba(239,68,68,.1);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
}

    background:rgba(96,165,250,.1);
    border:1px solid rgba(96,165,250,.3);

}

    background:linear-gradient(135deg,#0f1419,#1a1f26);
}

body.dark-mode .tracking-header{
    background:#1a1f2e;
    border-bottom:1px solid #374151;
}

body.dark-mode .pickup-id{
    color:#e0e6ed;
}

body.dark-mode .pickup-date{
    color:#9ca3af;
}

body.dark-mode .status-badge{
    background:#1e2433;
    border:1px solid #374151;
    color:#9ca3af;
}

body.dark-mode .status-badge.processing{
    background:rgba(251,146,60,.1);
    color:#fb923c;
    border:1px solid rgba(251,146,60,.3);
}

body.dark-mode .status-badge.completed{
    background:rgba(52,211,153,.1);
    color:#34d399;
    border:1px solid rgba(52,211,153,.3);
}

body.dark-mode .progress-container{
    background:#1a1f2e;
    border:1px solid #374151;
}

    background:#1e2433;

}

body.dark-mode .progress-step.completed{
    background:rgba(26,127,78,.2);
    border:1px solid #34d399;
}

}

body.dark-mode .progress-step.completed .progress-step-icon{

}

body.dark-mode .progress-step-title{

}

body.dark-mode .progress-step-time{

}

body.dark-mode .details-card{
    background:#1a1f2e;
    border:1px solid #374151;
}

body.dark-mode .details-card h3{
    color:#e0e6ed;
}

body.dark-mode .detail-row{
    border-bottom:1px solid #374151;

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
    transition:background .3s ease,color .3s ease;
}

/* =========================================================
   COMMON
========================================================= */

button,
input{
    font-family:inherit;
}

button{
    -webkit-tap-highlight-color:transparent;
}

.hidden{
    display:none!important;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
    background:
    radial-gradient(circle at top,#e9fff6,transparent 40%),
    #f7faf9;
}

.spinner{
    width:43px;
    height:43px;
    border-radius:50%;
    border:4px solid #d9eee6;
    border-top-color:var(--green);
    animation:spin .8s linear infinite;
}

.loading-text{
    font-size:13px;
    color:var(--muted);
    font-weight:600;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   SEARCH PAGE
========================================================= */

.search-page{
    min-height:100vh;
    padding:25px 18px 50px;

    background:
    radial-gradient(
        circle at 10% 0%,
        rgba(0,168,107,.12),
        transparent 28%
    ),
    radial-gradient(
        circle at 90% 20%,
        rgba(0,168,107,.08),
        transparent 25%
    ),
    #f5f8f7;
}

/* =========================================================
   SEARCH HEADER
========================================================= */

.search-header{
    max-width:1100px;
    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:46px;
    height:46px;
    border-radius:14px;
    overflow:hidden;
    background:#fff;
    border:1px solid #e5ece9;
    box-shadow:0 5px 18px rgba(0,0,0,.07);
    display:flex;
    align-items:center;
    justify-content:center;
}

.brand-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.brand-name{
    font-size:16px;
    font-weight:900;
    color:#111827;
    letter-spacing:.2px;
}

.brand-sub{
    margin-top:2px;
    font-size:10px;
    color:#7b8782;
}

.back-btn{
    height:40px;
    padding:0 14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fff;
    color:#374151;
    font-size:12px;
    font-weight:750;
    cursor:pointer;
}

/* =========================================================
   SEARCH GRID
========================================================= */

.search-container{
    width:100%;
    max-width:1100px;
    margin:auto;

    display:grid;
    grid-template-columns:
    minmax(330px,440px)
    minmax(0,1fr);

    gap:22px;
    align-items:stretch;
}

/* =========================================================
   MAIN TRACK CARD
========================================================= */

.pickup-form{
    background:#fff;
    border:1px solid #e6ece9;
    border-radius:26px;
    padding:28px;
    box-shadow:var(--shadow);
    animation:formIn .45s ease;
}

@keyframes formIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.form-logo{
    width:72px;
    height:72px;
    border-radius:21px;
    overflow:hidden;
    margin:0 auto 17px;

    background:#fff;
    border:1px solid #e5ece9;

    box-shadow:
    0 10px 28px rgba(0,168,107,.15);
}

.form-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.pickup-form h1{
    text-align:center;
    font-size:25px;
    line-height:1.2;
    font-weight:900;
    color:#111827;
}

.form-description{
    text-align:center;
    color:#718078;
    font-size:13px;
    line-height:1.6;
    margin:9px auto 23px;
    max-width:330px;
}

/* =========================================================
   ERROR MESSAGE
========================================================= */

.message-box{
    margin-bottom:15px;
    padding:12px 13px;
    border-radius:13px;
    font-size:11px;
    line-height:1.5;
    display:none;
}

.message-box.show{
    display:block;
}

.message-error{
    background:#fff2f2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.message-info{
    background:#effcf7;
    border:1px solid #c9f2df;
    color:#08754d;
}

/* =========================================================
   PHONE FIELD
========================================================= */

.input-label{
    display:block;
    margin-bottom:7px;

    font-size:10px;
    font-weight:850;
    color:#374151;
    letter-spacing:.4px;
}

.phone-wrapper{
    position:relative;
    margin-bottom:12px;
}

.phone-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    font-size:17px;
    pointer-events:none;
}

.phone-input{
    width:100%;
    height:52px;

    padding:0 14px 0 42px;

    border:1.5px solid #dfe6e2;
    border-radius:14px;

    background:#fbfdfc;

    outline:none;

    color:#111827;
    font-size:15px;
    font-weight:600;

    transition:.2s;
}

.phone-input:focus{
    border-color:var(--green);
    background:#fff;
    box-shadow:
    0 0 0 4px rgba(0,168,107,.09);
}

.phone-input::placeholder{
    color:#a0aaa5;
    font-weight:400;
}

/* =========================================================
   TRACK BUTTON
========================================================= */

.main-btn{
    width:100%;
    height:52px;

    border:0;
    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #00b878,
        #008f5b
    );

    color:#fff;

    font-size:14px;
    font-weight:850;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(0,168,107,.2);

    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-1px);
    box-shadow:
    0 11px 24px rgba(0,168,107,.26);
}

.main-btn:active{
    transform:scale(.98);
}

.main-btn.loading-btn{
    opacity:.75;
    pointer-events:none;
}

/* =========================================================
   SECONDARY BUTTON & DIVIDER
========================================================= */

.or-divider{
    display:flex;
    align-items:center;
    margin:15px 0;
    text-align:center;
}

.or-divider::before,
.or-divider::after{
    content:'';
    flex:1;
    border-bottom:1px solid #e0e0e0;
}

.or-divider span{
    padding:0 10px;
    color:#888;
    font-size:11px;
    font-weight:600;
}

.secondary-btn{
    width:100%;
    height:48px;
    border:2px solid #10b981;
    border-radius:14px;
    background:#fff;
    color:#10b981;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.secondary-btn:hover{
    background:#f0fdf4;
    transform:translateY(-1px);
}

.secondary-btn:active{
    transform:scale(.98);
}

/* =========================================================
   PHONE NOTE
========================================================= */

.phone-note{
    display:flex;
    align-items:center;
    gap:7px;

    margin-top:11px;

    color:#84908b;
    font-size:10px;
    line-height:1.4;
}

.phone-note-icon{
    width:19px;
    height:19px;
    border-radius:50%;
    background:#eafff5;
    color:#008f5b;

    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
    font-size:10px;
}

/* =========================================================
   HOW IT WORKS
========================================================= */

.how-title{
    margin-top:26px;
    padding-top:21px;
    border-top:1px solid #edf1ef;

    font-size:12px;
    font-weight:850;
    color:#111827;
}

.steps{
    margin-top:15px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.step{
    display:flex;
    gap:11px;
    align-items:flex-start;
}

.step-icon{
    width:34px;
    height:34px;
    border-radius:11px;

    flex-shrink:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#eafff5;
    color:#008f5b;

    font-size:15px;
}

.step-content{
    padding-top:1px;
}

.step-title{
    font-size:11px;
    font-weight:800;
    color:#27332e;
}

.step-text{
    margin-top:2px;
    font-size:10px;
    color:#8a958f;
    line-height:1.4;
}

/* =========================================================
   RIGHT INFORMATION CARD
========================================================= */

.info-card{
    min-height:100%;
    background:
    linear-gradient(
        145deg,
        #ffffff,
        #f5fffb
    );

    border:1px solid #e3eee9;
    border-radius:26px;

    padding:28px;

    box-shadow:var(--shadow);

    position:relative;
    overflow:hidden;
}

.info-card::before{
    content:"";
    position:absolute;

    width:220px;
    height:220px;

    border-radius:50%;

    background:rgba(0,168,107,.08);

    right:-80px;
    top:-90px;
}

.info-card-header{
    position:relative;
    z-index:2;
}

.info-small{
    display:inline-flex;
    align-items:center;
    gap:6px;

    padding:6px 9px;
    border-radius:20px;

    background:#e9fff6;
    color:#008653;

    font-size:9px;
    font-weight:850;
    letter-spacing:.4px;
}

.live-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#00a86b;
    animation:pulse 1.6s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
        opacity:1;
    }
    50%{
        transform:scale(1.4);
        opacity:.45;
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

.info-card h2{
    margin-top:15px;

    font-size:27px;
    line-height:1.18;
    font-weight:900;

    color:#111827;
    max-width:500px;
}

.info-card-description{
    margin-top:9px;

    font-size:13px;
    line-height:1.65;
    color:#718078;

    max-width:520px;
}

/* =========================================================
   TRACKING PREVIEW
========================================================= */

.tracking-preview{
    margin-top:25px;

    background:#fff;

    border:1px solid #e6eeea;
    border-radius:19px;

    padding:17px;

    position:relative;
    z-index:2;
}

.preview-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:17px;
}

.preview-title{
    font-size:12px;
    font-weight:850;
}

.preview-live{
    font-size:9px;
    color:#008653;
    font-weight:850;
}

.preview-line{
    position:relative;
    padding-left:39px;
}

.preview-item{
    position:relative;
    min-height:57px;
}

.preview-item:last-child{
    min-height:35px;
}

.preview-item::before{
    content:"";
    position:absolute;
    left:-24px;
    top:26px;
    width:2px;
    height:43px;
    background:#dce7e2;
}

.preview-item:last-child::before{
    display:none;
}

.preview-dot{
    position:absolute;
    left:-39px;
    top:0;

    width:30px;
    height:30px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#eafff5;
    color:#008f5b;

    font-size:13px;

    border:2px solid #c9f2df;
}

.preview-item.active .preview-dot{
    background:#00a86b;
    color:#fff;
    border-color:#00a86b;
    box-shadow:0 0 0 5px #e0faf0;
}

.preview-text{
    font-size:11px;
    font-weight:800;
    color:#27332e;
}

.preview-sub{
    margin-top:3px;
    font-size:9px;
    color:#89948f;
}

/* =========================================================
   BENEFITS
========================================================= */

.benefits{
    margin-top:20px;

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:9px;

    position:relative;
    z-index:2;
}

.benefit{
    background:#fff;
    border:1px solid #e7eeeb;
    border-radius:14px;
    padding:12px 9px;
    text-align:center;
}

.benefit-icon{
    font-size:17px;
}

.benefit-title{
    margin-top:5px;
    font-size:9px;
    font-weight:850;
}

.benefit-text{
    margin-top:2px;
    font-size:8px;
    color:#8b9691;
}

/* =========================================================
   PICKUP LIST
========================================================= */

.pickup-list-page{
    min-height:100vh;
    padding:25px 15px 50px;
    background:#f5f8f7;
}

.pickup-list-container{
    width:100%;
    max-width:650px;
    margin:auto;
}

.list-header{
    background:#fff;
    border-radius:22px;
    padding:22px;
    margin-bottom:14px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.list-header-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.list-logo{
    width:42px;
    height:42px;
    border-radius:13px;
    overflow:hidden;
    flex-shrink:0;
}

.list-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.list-header h2{
    font-size:20px;
    font-weight:900;
}

.list-header p{
    color:#6b7280;
    font-size:11px;
    margin-top:4px;
}

.pickup-card{
    background:#fff;
    border:1px solid #e8edeb;
    border-radius:19px;
    padding:17px;
    margin-bottom:12px;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 4px 15px rgba(0,0,0,.035);
}

.pickup-card:hover{
    border-color:#00a86b;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,168,107,.09);
}

.pickup-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.pickup-id{
    color:#00a86b;
    font-size:12px;
    font-weight:850;
}

.pickup-date{
    color:#9ca3af;
    font-size:10px;
    margin-top:4px;
}

.pickup-status{
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
    background:#e8fff5;
    color:#008f5b;
    white-space:nowrap;
}

.pickup-address{
    margin-top:13px;
    padding-top:13px;
    border-top:1px solid #f0f2f1;
    font-size:12px;
    color:#4b5563;
    line-height:1.5;
}

.partner-row{
    margin-top:10px;
    color:#00a86b;
    font-size:11px;
    font-weight:750;
}

/* =========================================================
   TRACKING PAGE
========================================================= */

.tracking-page{
    min-height:100vh;
    background:#f5f7f8;
}

.top-header{
    height:66px;
    background:#fff;
    border-bottom:1px solid #e8ecea;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 22px;

    position:relative;
    z-index:2000;
}

.header-actions{
    display:flex;
    gap:8px;
}

.header-btn{
    border:1px solid #e5e7eb;
    background:#fff;
    height:38px;
    padding:0 13px;
    border-radius:11px;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
    color:#374151;
}

.desktop-layout{
    max-width:1400px;
    margin:auto;
    padding:16px;

    display:grid;

    grid-template-columns:
    minmax(0,1.45fr)
    minmax(320px,.65fr);

    gap:16px;
}

/* =========================================================
   MAP
========================================================= */

.map-card{
    position:relative;

    height:calc(100vh - 98px);
    min-height:500px;

    border-radius:20px;
    overflow:hidden;

    background:#dfe9e5;
    box-shadow:var(--shadow);
}

#map{
    width:100%;
    height:100%;
    position:relative;
    z-index:1;
}

.map-top-overlay{
    position:absolute;
    top:13px;
    left:13px;
    right:13px;
    z-index:1000;
    pointer-events:none;
}

.live-status-card{
    max-width:510px;

    background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);

    border:1px solid rgba(255,255,255,.8);

    border-radius:15px;

    padding:9px;

    display:flex;
    align-items:center;
    gap:9px;

    box-shadow:0 8px 25px rgba(0,0,0,.12);

    pointer-events:auto;
}

.partner-avatar{
    width:43px;
    height:43px;

    border-radius:13px;

    flex-shrink:0;

    background:
    linear-gradient(
        135deg,
        #00b976,
        #008f5b
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:20px;
}

.status-info{
    min-width:0;
    flex:1;
}

.partner-name{
    font-size:13px;
    font-weight:850;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.partner-phone{
    font-size:9px;
    color:#7b8581;
    margin-top:2px;
}

.status-badge{
    display:flex;
    align-items:center;
    gap:5px;

    margin-top:3px;

    font-size:9px;
    color:#008f5b;
    font-weight:800;
}

.pulse{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00b976;
    animation:pulse 1.7s infinite;
}

.eta-box{
    min-width:70px;

    padding:8px 8px;

    text-align:center;

    background:#eafff5;
    border:1px solid #cdf6e5;

    border-radius:11px;
}

.eta-time{
    color:#006f48;
    font-size:15px;
    line-height:1.1;
    font-weight:900;
}

.eta-label{
    color:#00a86b;
    font-size:8px;
    text-transform:uppercase;
    font-weight:850;
    letter-spacing:.6px;
    margin-top:2px;
}

.locate-btn{
    position:absolute;
    right:13px;
    bottom:100px;

    z-index:1000;

    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:#fff;

    box-shadow:0 5px 18px rgba(0,0,0,.15);

    cursor:pointer;
    font-size:17px;
}

.distance-badge{
    position:absolute;
    left:50%;
    bottom:15px;

    transform:translateX(-50%);

    z-index:1000;

    background:#111827;
    color:#fff;

    padding:8px 14px;
    border-radius:25px;

    font-size:10px;
    font-weight:800;

    box-shadow:0 8px 25px rgba(0,0,0,.25);

    white-space:nowrap;
}

.map-float-label{
    position:absolute;
    top:75px;
    left:13px;

    z-index:999;

    background:rgba(17,24,39,.9);
    color:#fff;

    padding:6px 9px;
    border-radius:8px;

    font-size:8px;
    font-weight:800;
}

/* =========================================================
   SIDE PANEL
========================================================= */

.side-panel{
    min-width:0;

    display:flex;
    flex-direction:column;
    gap:12px;

    overflow:auto;
}

.panel-card{
    background:#fff;
    border-radius:17px;
    padding:15px;

    box-shadow:0 5px 20px rgba(15,23,42,.05);

    border:1px solid #edf0ef;
}

.panel-title{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:12px;
}

.panel-title h2{
    font-size:14px;
    font-weight:850;
}

.panel-title span{
    font-size:9px;
    color:#9ca3af;
}

.status-large{
    padding:12px;

    background:
    linear-gradient(
        135deg,
        #ecfff7,
        #f8fffc
    );

    align-items:center;
    gap:10px;

.status-large-icon{

    height:37px;

    align-items:center;

    color:#fff;
    font-size:18px;
}

.status-large-title{

    font-weight:850;
}

.status-large-sub{
    font-size:9px;

    margin-top:2px;
}

.order-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.summary-box{
    padding:10px;
    background:#f8faf9;
    border-radius:11px;
}

.summary-label{
    font-size:8px;
    color:#8a938f;
    margin-bottom:4px;
    font-weight:650;
}

.summary-value{
    font-size:11px;
    color:#111827;
    font-weight:750;
    word-break:break-word;
}

.timeline{
    margin-top:0;
}

.timeline-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:13px;
}

.timeline-header h3{
    font-size:12px;
    font-weight:850;
}

.timeline-header span{
    font-size:8px;
    color:#9ca3af;
}

.timeline-item{
    display:flex;
    position:relative;
    gap:10px;
    min-height:49px;
}

.timeline-marker{
    width:27px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    flex-shrink:0;
}

.timeline-dot{
    width:24px;
    height:24px;

    border-radius:50%;

    background:#f0f2f3;
    border:2px solid #e3e7e5;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;

    z-index:2;
}

.timeline-line{
    position:absolute;

    top:24px;
    bottom:-2px;

    width:2px;

    background:#e5e7eb;
}

.timeline-item.active .timeline-dot{
    background:#00a86b;
    border-color:#00a86b;
    color:#fff;

    box-shadow:0 0 0 4px #dffbef;
}

.timeline-item.active .timeline-line{
    background:#b7ecd8;
}

.timeline-item.current .timeline-dot{
    animation:currentPulse 1.7s infinite;
}

@keyframes currentPulse{
    0%,100%{
        box-shadow:0 0 0 4px #dffbef;
    }

    50%{
        box-shadow:
        0 0 0 7px rgba(0,168,107,.08);
    }
}

.timeline-content{
    padding:1px 0 13px;
    flex:1;
}

.timeline-text{
    font-size:10px;
    font-weight:700;
    color:#9ca3af;
}

.timeline-item.active .timeline-text{
    color:#111827;
}

.timeline-time{
    margin-top:2px;
    font-size:8px;
    color:#a1a7ad;
}

.timeline-item.current .timeline-text{
    color:#00a86b;
}

.action-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.action-btn{
    height:40px;
    border:0;
    border-radius:11px;
    cursor:pointer;
    font-size:10px;
    font-weight:800;
}

.action-primary{
    background:#00a86b;
    color:#fff;
}

.action-secondary{
    background:#f3f5f5;
    color:#374151;
}

    color:#111827;
}

.close-modal{

/* =========================================================
   PHONE NORMALIZATION
   FIX +91 ISSUE
========================================================= */

function normalizePhone(value){

if(value===null||
value===undefined){

return "";

}


/*
Remove:

+
spaces
-
brackets
letters
etc.
*/

let digits=
String(value)
.replace(/\D/g,"");


/*
India +91 handling.

Examples:

+91 9876543210
919876543210
09876543210
9876543210

All become:

9876543210
*/

if(digits.startsWith("0091")){

digits=
digits.substring(4);

}

if(digits.startsWith("91")&&
digits.length===12){

digits=
digits.substring(2);

}

if(digits.startsWith("0")&&
digits.length===11){

digits=
digits.substring(1);

}


/*
Return last 10 digits for Indian numbers.
*/

if(digits.length>10){

digits=
digits.slice(-10);

}

return digits;

}


/* =========================================================
   PHONE MATCH
========================================================= */

function phonesMatch(
phone1,
phone2
){

const a=
normalizePhone(phone1);

const b=
normalizePhone(phone2);


if(!a||!b)
return false;


return a===b;

}


/* =========================================================
   SEARCH BY PHONE
========================================================= */

async function searchByPhone(
searchPhone
){

showSearching();


try{

const snap=
await get(
ref(
db,
"pickupRequests"
)
);


if(!snap.exists()){

showInputForm(
"No pickup requests are available yet."
);

return;

}


const data=
snap.val();


const normalizedSearch=
normalizePhone(
searchPhone
);


if(
!normalizedSearch||
normalizedSearch.length<10
){

showInputForm(
"Please enter a valid 10-digit mobile number."
);

return;

}


/*
Search every pickup.

This supports fields:

phone
mobile
customerPhone
customerMobile

and formats such as:

+91 9876543210
919876543210
09876543210
9876543210
*/

const matches=
Object.entries(data)

.filter(
([id,p])=>{

if(!p)
return false;


const possiblePhones=[

p.phone,

p.mobile,

p.customerPhone,

p.customerMobile,

p.phoneNumber,

p.customer?.phone,

p.customer?.mobile

];


return possiblePhones.some(
phone=>
phonesMatch(
phone,
normalizedSearch
)
);

}
)

.map(
([id,p])=>({

...p,

id

})
)

.sort(
(a,b)=>{

const aTime=
getTimestamp(
a.createdAt||
a.submittedAt||
a.timestamp||
0
);

const bTime=
getTimestamp(
b.createdAt||
b.submittedAt||
b.timestamp||
0
);

return bTime-aTime;

}
);


console.log(
"Phone searched:",
normalizedSearch
);

console.log(
"Matching pickups:",
matches
);


if(!matches.length){

showInputForm(
"No pickup found for this mobile number."
);

return;

}


/*
One pickup
*/

if(matches.length===1){

pickupId=
matches[0].id;

loadPickup();

return;

}


/*
Multiple pickups
*/

showPickupList(
matches
);


}catch(error){

console.error(
"Tracking search error:",
error
);

showInputForm(
"Unable to search right now. Please check your internet connection and try again."
);

}

}

document.getElementById(
"phoneInput"

"trackButton"

const phone=
input.value.trim();


const normalized=
normalizePhone(phone);

!normalized||
normalized.length!==10

"Please enter a valid 10-digit mobile number.",
"error"
);

input.focus();

return;

/*
Show loading.
*/

"🔎 Finding pickup...";

"loading-btn"
);

+91 9876543210

becomes:

encodeURIComponent(
normalized
);

window.checkCompletedOrders=async function(){

const input=document.getElementById("phoneInput");
const phone=input.value.trim();
const normalized=normalizePhone(phone);

if(!normalized || normalized.length!==10){
showMessage("Please enter a valid 10-digit mobile number.","error");
input.focus();
return;
}

// Show loading modal
const modal=document.createElement('div');
modal.className='completion-modal';
modal.innerHTML=`
<div class="completion-modal-content">
<div class="completion-modal-header">
<h3>📋 Order History</h3>
<button class="close-modal" onclick="this.closest('.completion-modal').remove()">✕</button>
</div>
<div class="completion-modal-body">
<div class="loading-spinner">🔄 Loading...</div>
</div>
</div>
`;
document.body.appendChild(modal);

try{
// Check Firebase for orders
const pickupsRef=ref(db,'pickupRequests');
const snapshot=await get(pickupsRef);

if(!snapshot.exists()){
modal.querySelector('.completion-modal-body').innerHTML=`
<div class="no-orders">
<div class="no-orders-icon">📦</div>
<p>No orders found for this number</p>
</div>
`;
return;
}

const allPickups=snapshot.val();
const userOrders=Object.entries(allPickups).filter(([id,p])=>{
const pPhone=normalizePhone(p.mobile||p.phone||'');
return pPhone===normalized;
});

if(userOrders.length===0){
modal.querySelector('.completion-modal-body').innerHTML=`
<div class="no-orders">
<div class="no-orders-icon">📦</div>
<p>No orders found for this number</p>
</div>
`;
return;
}

// Check localStorage for completion data
const completedOrders=JSON.parse(localStorage.getItem('completedOrders')||'{}');

// Build order list
let html='<div class="order-list">';
userOrders.forEach(([id,order])=>{
const status=order.trackingStatus||'pending';
const isCompleted=status==='completed';
const completionData=completedOrders[id];

const statusColors={
pending:'#fbbf24',
confirmed:'#3b82f6',
on_the_way:'#8b5cf6',
picked_up:'#10b981',
completed:'#059669'
};

const statusLabels={
pending:'📝 Pending',
confirmed:'✅ Confirmed',
on_the_way:'🚛 On the Way',
picked_up:'📦 Picked Up',
completed:'🎉 Completed'
};

html+=`
<div class="order-card ${isCompleted?'completed':''}">
<div class="order-header">
<div class="order-id">Order #${id.slice(-6)}</div>
<div class="order-status" style="background:${statusColors[status]}20;color:${statusColors[status]}">
${statusLabels[status]||status}
</div>
</div>
<div class="order-details">
<div class="order-row">
<span>Name:</span>
<strong>${order.name||order.customerName||'N/A'}</strong>
</div>
<div class="order-row">
<span>Amount:</span>
<strong>₹${order.totalAmount||0}</strong>
</div>
${completionData?`
<div class="order-row completion-saved">
<span>✓ Saved to device:</span>
<strong>${new Date(completionData.completedAt).toLocaleString()}</strong>
</div>
`:''}
</div>
<div class="order-actions">
<button onclick="window.location.href='track.html?id=${id}'" class="view-btn">
View Details
</button>
</div>
</div>
`;
});
html+='</div>';

modal.querySelector('.completion-modal-body').innerHTML=html;

}catch(error){
console.error('Error fetching orders:',error);
modal.querySelector('.completion-modal-body').innerHTML=`
<div class="error-message">
<div class="error-icon">⚠️</div>
<p>Failed to load orders</p>
<small>${error.message}</small>
</div>
`;
}

};

/* =========================================================
   ESCAPE
========================================================= */

function esc(v){

return String(v??"")
.replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}


function escAttr(v){

return String(v??"")
.replace(
/'/g,
"\\'"
);

}


/* =========================================================
   TIMESTAMP
========================================================= */

function getTimestamp(value){

if(!value)
return 0;


/*
Firebase timestamp number
*/

if(typeof value==="number")
return value;


/*
Firebase timestamp object
*/

if(
typeof value==="object"&&
value.seconds
){

return Number(value.seconds)*1000;

}


const date=
new Date(value);

const time=
date.getTime();

return isNaN(time)
?
0
:
time;

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

const time=
getTimestamp(value);

if(!time)
return"Date unknown";


return new Date(time)
.toLocaleString(
"en-IN",
{
day:"2-digit",
month:"short",
year:"numeric",
hour:"2-digit",
minute:"2-digit",
hour12:true
}
);

}


/* =========================================================
   CUSTOMER GPS
========================================================= */

function getCustomerGPS(r){

const lat=

r.latitude||

r.pickupLatitude||

r.customerLatitude||

(
r.customerGPS&&
r.customerGPS.latitude
);


const lng=

r.longitude||

r.pickupLongitude||

r.customerLongitude||

(
r.customerGPS&&
r.customerGPS.longitude
);


if(
lat!=null&&
lng!=null
){

return{

lat:Number(lat),

lng:Number(lng)

};

}


return null;

}


/* =========================================================
   PARTNER GPS
========================================================= */

function getPartnerGPS(r){

const gps=
r.partnerGPS||
r.partnerLocation;


if(

gps&&

gps.latitude!=null&&

gps.longitude!=null

){

return{

lat:Number(
gps.latitude
),

lng:Number(
gps.longitude
),

enabled:
gps.enabled===true

};

}


return null;

}


/* =========================================================
   STATUS
========================================================= */

function getCurrentStatus(){

if(!pickup)
return"Preparing";


const status=
String(
pickup.status||
""
).toLowerCase();


if(
pickup.completedAt||
status.includes("completed")
)
return"Completed";


if(
pickup.pickupStartedAt||
status.includes("pickup started")
)
return"Pickup Started";


if(
pickup.arrivedAt||
status.includes("arrived")
)
return"Arrived";


if(
pickup.goingToPickupAt||
pickup.onTheWayAt||
status.includes("way")||
status.includes("going")
)
return"On The Way";


if(
pickup.partnerAssignedAt||
pickup.partnerName||
status.includes("assigned")
)
return"Partner Assigned";


if(
pickup.processingAt||
status.includes("processing")
)
return"Processing";


return"Pickup Created";

}

/* =========================================================
   DISTANCE
========================================================= */

function calculateDistance(
lat1,
lng1,
lat2,
lng2
){

const R=6371;

const dLat=
(lat2-lat1)*
Math.PI/180;

const dLng=
(lng2-lng1)*
Math.PI/180;


const a=

Math.sin(dLat/2)*
Math.sin(dLat/2)

+

Math.cos(
lat1*Math.PI/180
)*

Math.cos(
lat2*Math.PI/180
)*

Math.sin(dLng/2)*
Math.sin(dLng/2);


const c=
2*
Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);


return R*c;

}


function formatDistance(km){

if(km<1){

return Math.round(
km*1000
)+" m away";

}

return km.toFixed(1)+
" km away";

}


function calculateETA(
distanceKm
){

const avgSpeed=30;

const minutes=
Math.ceil(
(distanceKm/avgSpeed)*60
);


if(minutes<1)
return"Arriving";

if(minutes===1)
return"1 min";

if(minutes<60)
return minutes+" mins";


const hrs=
Math.floor(minutes/60);

const mins=
minutes%60;


return hrs+"h "+
mins+"m";

}

},

{

pickup.processingAt
},

{

pickup.partnerAssignedAt
},

{
icon:"🚚",

pickup.onTheWayAt
},

{

},

{
icon:"✅",

time:

}

];


let lastActive=-1;


stages.forEach(
(s,i)=>{

if(s.time)
lastActive=i;

}
);


const html=
stages.map(
(s,i)=>`

<div class="
timeline-item
${s.time?"active":""}
${i===lastActive?"current":""}
">

<div class="timeline-marker">

<div class="timeline-dot">

${s.time?s.icon:""}

</div>

${
i<stages.length-1
?
`<div class="timeline-line"></div>`

""
}

</div>

:

}

`
).join("");

document.getElementById(
"timelineContainer"
);

document.getElementById(
"mobileTimelineContainer"
);

if(mobile)
mobile.innerHTML=html;

}


/* =========================================================
   TIME
========================================================= */

function formatTime(value){

const time=
getTimestamp(value);

if(!time)
return"Waiting";


return new Date(time)
.toLocaleString(
"en-IN",
{
day:"2-digit",
month:"short",
hour:"2-digit",
minute:"2-digit",
hour12:true
}
);

}


/* =========================================================
   FIT MAP
========================================================= */

window.fitTracking=
function(){

if(!map)
return;


const points=[];


if(customerMarker){

points.push(
customerMarker.getLatLng()
);

}


if(partnerMarker){

points.push(
partnerMarker.getLatLng()
);

}


if(points.length===1){

map.setView(
points[0],
15,
{
animate:true
}
);

}else if(points.length>1){

const bounds=
L.latLngBounds(points);


map.fitBounds(
bounds,
{
padding:[60,60],
maxZoom:16,
animate:true
}
);

}

};


/* =========================================================
   LIVE UPDATE
========================================================= */

setInterval(
()=>{

if(!pickup||!map)
return;


const custGPS=
getCustomerGPS(pickup);

const partGPS=
getPartnerGPS(pickup);


if(
!custGPS||
!partGPS||
!partGPS.enabled
)
return;


const dist=
calculateDistance(

custGPS.lat,
custGPS.lng,

partGPS.lat,
partGPS.lng

);


const distBadge=
document.getElementById(
"distanceBadge"
);

const etaEl=
document.getElementById(
"etaTime"
);


if(distBadge){

distBadge.textContent=
formatDistance(dist);

}


if(etaEl){

etaEl.textContent=
calculateETA(dist);

}

},
10000
);

null;

}

    if(theme === "dark"){
        document.body.classList.add("dark-mode");
    } else {
        document.body.classList.remove("dark-mode");
    }
}

window.addEventListener('DOMContentLoaded', () => {
    if (!localStorage.getItem('lang')) {
        localStorage.setItem('lang', 'en');
    }
    applySavedTheme();
    initLangTheme();
});
</script>

<!-- Real-time Tracking Update Script -->
<script src="track-realtime-update.js"></script>

<script>
// Start real-time tracking when pickup data is loaded
window.addEventListener('DOMContentLoaded', function(){
    // Wait for pickup data to load
    setTimeout(function(){
        const pickupIdElement = document.getElementById('pickupIdVal');
        if(pickupIdElement && pickupIdElement.textContent){
            const trackingPickupId = pickupIdElement.textContent.trim();
            console.log('Starting real-time tracking for:', trackingPickupId);

            // Start listening to real-time updates
            if(typeof listenToRealtimeUpdates === 'function'){
                listenToRealtimeUpdates(trackingPickupId);
            }
        }
        // Fallback: try global pickupId variable
        else if(typeof pickupId !== 'undefined' && pickupId){
            console.log('Starting real-time tracking for:', pickupId);
            if(typeof listenToRealtimeUpdates === 'function'){
                listenToRealtimeUpdates(pickupId);
            }
        }
    }, 1000);
});
</script>
