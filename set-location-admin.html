<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Set Pickup Location - Admin</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Arial,sans-serif;
background:#f4f7f5;
color:#17251d;
}

header{
background:linear-gradient(135deg,#063d22,#149447);
color:#fff;
padding:18px;
}

.container{
max-width:900px;
margin:20px auto;
padding:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:24px;
box-shadow:0 2px 12px rgba(0,0,0,0.08);
margin-bottom:20px;
}

h2{
font-size:20px;
margin-bottom:16px;
color:#063d22;
}

.info-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:20px;
}

.info-item{
background:#f7faf8;
padding:12px;
border-radius:8px;
}

.info-label{
font-size:11px;
color:#6b7280;
margin-bottom:4px;
}

.info-value{
font-size:14px;
font-weight:600;
color:#1a1a1a;
}

#map{
width:100%;
height:400px;
border-radius:12px;
margin-bottom:16px;
}

.location-info{
background:#d1fae5;
padding:14px;
border-radius:8px;
margin-bottom:16px;
font-size:13px;
color:#065f46;
}

.btn-group{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
padding:14px;
border:0;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:.2s;
}

button:hover{
transform:translateY(-1px);
}

.btn-primary{
background:#149447;
color:#fff;
}

.btn-secondary{
background:#e5e7eb;
color:#374151;
}

.btn-danger{
background:#ef4444;
color:#fff;
}

.current-location-btn{
width:100%;
background:#10b981;
color:#fff;
margin-bottom:12px;
}

.loading{
text-align:center;
padding:40px;
color:#6b7280;
}
</style>
</head>

<body>

<header>
<h1>📍 Set Pickup Location</h1>
</header>

<div class="container">

<div class="card">
<h2>Pickup Details</h2>
<div class="info-grid">
<div class="info-item">
<div class="info-label">Pickup ID</div>
<div class="info-value" id="pickupId">-</div>
</div>
<div class="info-item">
<div class="info-label">Customer</div>
<div class="info-value" id="customer">-</div>
</div>
<div class="info-item">
<div class="info-label">Phone</div>
<div class="info-value" id="phone">-</div>
</div>
<div class="info-item">
<div class="info-label">Status</div>
<div class="info-value" id="status">-</div>
</div>
<div class="info-item" style="grid-column:1/-1">
<div class="info-label">Address</div>
<div class="info-value" id="address">-</div>
</div>
</div>
</div>

<div class="card">
<h2>📍 Set GPS Coordinates</h2>

<button class="current-location-btn" onclick="useCurrentLocation()">
📍 Use My Current Location (Admin)
</button>

<div id="map"></div>

<div class="location-info" id="locationInfo">
Click on map or use button above to set pickup location
</div>

<div class="btn-group">
<button class="btn-primary" onclick="saveLocation()">
💾 Save Location
</button>
<button class="btn-secondary" onclick="window.close()">
Cancel
</button>
</div>
</div>

</div>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
get,
update
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyApJhYmo0pHNqVD0XIyOlQDqDzACztHA",
authDomain:"covai-scrap-hub.firebaseapp.com",
databaseURL:"https://covai-scrap-hub-default-rtdb.firebaseio.com",
projectId:"covai-scrap-hub",
storageBucket:"covai-scrap-hub.firebasestorage.app",
messagingSenderId:"979133721874",
appId:"1:979133721874:web:c5829bb8dbf5270c0917cb",
measurementId:"G-P3PTSBHWMF"
};

const db=getDatabase(initializeApp(firebaseConfig));

const params=new URLSearchParams(location.search);
const pickupId=params.get("id");

if(!pickupId){
alert("Pickup ID missing");
window.close();
}

let pickup=null;
let map=null;
let marker=null;
let selectedLat=null;
let selectedLng=null;

// Load pickup data
get(ref(db,"pickupRequests/"+pickupId)).then(snap=>{

if(!snap.exists()){
alert("Pickup not found");
window.close();
return;
}

pickup=snap.val();

document.getElementById("pickupId").textContent=pickupId;
document.getElementById("customer").textContent=
pickup.customerName||pickup.customer||"N/A";
document.getElementById("phone").textContent=
pickup.phone||pickup.mobile||"N/A";
document.getElementById("address").textContent=
pickup.address||pickup.pickupAddress||"N/A";
document.getElementById("status").textContent=
pickup.status||"New";

// Init map
const lat=pickup.latitude||pickup.customerLatitude||11.0168;
const lng=pickup.longitude||pickup.customerLongitude||76.9558;

selectedLat=lat;
selectedLng=lng;

map=L.map('map').setView([lat,lng],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
maxZoom:19
}).addTo(map);

marker=L.marker([lat,lng],{
draggable:true
}).addTo(map);

marker.on('dragend',function(e){
const pos=marker.getLatLng();
selectedLat=pos.lat;
selectedLng=pos.lng;
updateLocationInfo();
});

map.on('click',function(e){
selectedLat=e.latlng.lat;
selectedLng=e.latlng.lng;
marker.setLatLng([selectedLat,selectedLng]);
updateLocationInfo();
});

updateLocationInfo();

}).catch(error=>{
alert("Error loading pickup: "+error.message);
window.close();
});

function updateLocationInfo(){
document.getElementById("locationInfo").innerHTML=`
<strong>Selected Coordinates:</strong><br>
Latitude: ${selectedLat.toFixed(6)}<br>
Longitude: ${selectedLng.toFixed(6)}
`;
}

window.useCurrentLocation=function(){

if(!navigator.geolocation){
alert("Location not supported by browser");
return;
}

document.getElementById("locationInfo").innerHTML=
"📍 Getting your location...";

navigator.geolocation.getCurrentPosition(

position=>{

selectedLat=position.coords.latitude;
selectedLng=position.coords.longitude;

map.setView([selectedLat,selectedLng],15);
marker.setLatLng([selectedLat,selectedLng]);

updateLocationInfo();

},

error=>{

alert("Unable to get location: "+error.message);

}

);

};

window.saveLocation=async function(){

if(!selectedLat||!selectedLng){
alert("Please select a location first");
return;
}

if(!confirm("Save this location for pickup "+pickupId+"?")){
return;
}

try{

await update(ref(db,"pickupRequests/"+pickupId),{
latitude:selectedLat,
longitude:selectedLng,
customerLatitude:selectedLat,
customerLongitude:selectedLng,
locationUpdatedBy:"admin",
locationUpdatedAt:new Date().toISOString()
});

alert("✅ Location saved successfully!");

window.close();

}catch(error){

alert("Error saving location: "+error.message);

}

};

</script>

</body>
</html>
